<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="신제품 개발 일정 보드">
<meta property="og:type" content="website">
<meta property="og:title" content="해밀리 상품화본부 NPDP">
<meta property="og:description" content="신제품 개발 일정 보드">
<meta property="og:image" content="https://hemilyrnd-npdp.github.io/npdp/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://hemilyrnd-npdp.github.io/npdp/">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex,nofollow">
<title>해밀리 NPDP 일정 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 제품 포트폴리오 타임라인(홈) → 제품별 간트(좌측 고정 공정열 + 우측 드래그 타임라인) */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --sunk:#eceee9; --line:#dde0d8; --line-strong:#c4c8bd;
  --fg:#1d2420; --muted:#626b64; --faint:#8e968f;
  --accent:#1f6b52; --accent-fg:#ffffff; --accent-soft:#dcebe3;
  --today:#c8452c; --weekend:rgba(60,80,120,.055); --holiday:rgba(200,69,44,.075);
  --warn:#a5650b; --warn-soft:#f6ead4;
  --pc0:#0f5a45; --pc1:#c4661c; --pc2:#2b7a55; --pc3:#7d5f33; --pc4:#a3365a;
  --c0:#3d7a5c; --c1:#3a68b0; --c2:#b0507f; --c3:#b37718; --c4:#7454b8; --c5:#23888c; --c6:#857563;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 6px 24px rgba(20,30,25,.08);
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pc0:#6cc39d; --pc1:#f0a058; --pc2:#7fcf9f; --pc3:#d1b07a; --pc4:#ec8fae;
  --bg:#141816; --surface:#1b201d; --sunk:#111412; --line:#2b322e; --line-strong:#3c4540;
  --fg:#e6ebe7; --muted:#9aa49d; --faint:#6f7972;
  --accent:#5fbf97; --accent-fg:#0d1a14; --accent-soft:#1f3a2f;
  --today:#ff7a5c; --weekend:rgba(140,170,220,.05); --holiday:rgba(255,122,92,.08);
  --warn:#e3a54a; --warn-soft:#3a2d17;
  --c0:#5fae86; --c1:#6b9fe6; --c2:#e07fad; --c3:#dda24a; --c4:#a68ce8; --c5:#4fc0c3; --c6:#b3a492;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --pc0:#6cc39d; --pc1:#f0a058; --pc2:#7fcf9f; --pc3:#d1b07a; --pc4:#ec8fae;
  --bg:#141816; --surface:#1b201d; --sunk:#111412; --line:#2b322e; --line-strong:#3c4540;
  --fg:#e6ebe7; --muted:#9aa49d; --faint:#6f7972;
  --accent:#5fbf97; --accent-fg:#0d1a14; --accent-soft:#1f3a2f;
  --today:#ff7a5c; --weekend:rgba(140,170,220,.05); --holiday:rgba(255,122,92,.08);
  --warn:#e3a54a; --warn-soft:#3a2d17;
  --c0:#5fae86; --c1:#6b9fe6; --c2:#e07fad; --c3:#dda24a; --c4:#a68ce8; --c5:#4fc0c3; --c6:#b3a492;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;border-bottom:1px solid var(--line);flex:none}
.acct{display:inline-flex;align-items:center;gap:6px;padding-left:10px;margin-left:2px;border-left:1px solid var(--line);font-size:12px;color:var(--muted)}
.acct-name{color:var(--fg);font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-role{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.gate{display:flex;justify-content:center;padding:8vh 16px}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 26px;box-shadow:var(--shadow)}
.gate-card h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.gate-sub{margin:0 0 18px;color:var(--muted);font-size:13px}
.gate-msg{margin:-6px 0 14px;padding:8px 10px;border-radius:7px;background:var(--warn-soft);color:var(--warn);font-size:12.5px}
.gate-btn{width:100%;height:38px;justify-content:center;font-size:14px}
.gate-or{display:flex;align-items:center;gap:10px;margin:18px 0 10px;color:var(--faint);font-size:12px}
.gate-or::before,.gate-or::after{content:"";flex:1;border-top:1px solid var(--line)}
.gate-form{display:flex;gap:6px}
.gate-form input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid var(--line-strong);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;font-size:13.5px}
.gate-form input:focus{outline:none;border-color:var(--accent)}
.gate-form .btn{height:34px}
.gate-foot{margin:16px 0 0;color:var(--faint);font-size:12px;line-height:1.55}
.mem-add{display:flex;gap:6px}
.mem-add input{flex:1;min-width:0;height:30px;padding:0 9px;border:1px solid var(--line-strong);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
.mem-add select,.mem-row select{height:30px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--fg);font:inherit;font-size:12.5px;padding:0 6px}
.mem-legend{font-size:11.5px;color:var(--muted);line-height:1.6}
.mem-list{display:flex;flex-direction:column;overflow:auto;min-height:0;border-top:1px solid var(--line)}
.mem-row{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.mem-who{flex:1;min-width:0;display:flex;flex-direction:column}
.mem-who b{font-size:13px}
.mem-who span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-me{font-size:11.5px;color:var(--accent);font-weight:600}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand .co{font-size:12px;color:var(--muted);letter-spacing:.04em}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;flex:0 1 auto}
.crumb .sep{color:var(--faint)}
.crumb .pname{font-size:17px;font-weight:700;letter-spacing:-.02em;border:1px solid transparent;border-radius:6px;padding:1px 6px;background:none;min-width:0;max-width:100%;text-overflow:ellipsis}
.crumb .pname:hover{border-color:var(--line)}
.crumb .pname:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.spacer{flex:1}
.today-chip{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--sunk);border-color:transparent}
.btn.danger{color:var(--today)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;height:28px}
.seg button{border:0;background:var(--surface);padding:0 11px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ro-banner{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:4px 10px;border-radius:6px}

main{flex:1;min-height:0;display:flex;flex-direction:column}

/* HOME */
.home{flex:1;min-height:0;overflow:auto;padding-block:16px 32px}
.home-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.home-head h2{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.home-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.board-scroll{overflow-x:auto}
.ptable{min-width:880px}
.prow{display:grid;grid-template-columns:minmax(720px,1.8fr) 120px 76px minmax(150px,0.85fr) minmax(300px,2.2fr);align-items:center;border-bottom:1px solid var(--line-strong);min-height:58px}
.prow:last-child{border-bottom:0}
.prow.head{min-height:44px;background:var(--sunk);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.prow > div{padding:8px 12px;min-width:0}
.prow:not(.head):hover{background:var(--sunk)}
.prow.started{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.prow.started .dday:not(.past):not(.urg){background:var(--surface)}
.prow.started:not(.head):hover{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.legend-sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line-strong);background:color-mix(in srgb,var(--accent) 10%,var(--surface));vertical-align:-2px;margin:0 4px 0 12px}
.plink{font-weight:600;font-size:14.5px;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plink:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.psub{font-size:12px;color:var(--muted)}
.owner{font-size:13px}
.dday{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.dday.none{background:var(--sunk);color:var(--faint);font-weight:500}
.dday.past{background:var(--sunk);color:var(--muted)}
.dday.urg{--red:#c8312a;background:color-mix(in srgb,var(--red) var(--u),var(--surface));color:color-mix(in srgb,var(--red) 85%,var(--fg,#1d2420));border:1px solid color-mix(in srgb,var(--red) calc(var(--u) + 18%),var(--surface))}
.dday.urg.hot{color:#fff;border-color:transparent}
.urg-scale{display:inline-block;width:46px;height:9px;border-radius:999px;vertical-align:-1px;margin:0 4px 0 12px;border:1px solid var(--line-strong);background:linear-gradient(90deg,var(--surface),#c8312a)}
.next{font-size:11.5px;line-height:1.4;overflow:hidden}
.next b{font-weight:600}
.next .d{color:var(--muted);font-size:10.5px}
.strip{position:relative;height:30px}
.strip .lane{position:absolute;inset:11px 0;background:var(--sunk);border-radius:3px}
.strip .seg2{position:absolute;top:9px;height:12px;border-radius:2px;opacity:.9}
.strip .tl{position:absolute;top:0;bottom:0;width:1.5px;background:var(--today)}
.strip .launch{position:absolute;top:4px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);background:var(--today);border-radius:1px}
.axis2{position:relative;height:32px;container-type:inline-size}
.axis2 .yrow,.axis2 .mrow{position:absolute;left:0;right:0;height:16px}
.axis2 .yrow{top:0}.axis2 .mrow{top:16px}
.axis2 .yrow > span{position:absolute;top:0;bottom:0;padding-left:4px;border-left:1px solid var(--line-strong);font-size:11px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;line-height:15px}
.axis2 .mrow > span{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-strong);font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;line-height:16px}
.axis2 .mrow > span.y{border-left-color:var(--fg)}
@container (max-width:560px){ .axis2 .mrow .u{display:none} }
.strip .mdiv{position:absolute;top:2px;bottom:2px;width:1px;background:var(--line)}
.strip .mdiv.y{background:var(--line-strong)}
.pcell{display:grid;grid-template-columns:20px 36px minmax(0,1fr);align-items:start;column-gap:10px;min-width:0}
.pcell .no{align-self:center}
.pcell > a.tlink{display:block;width:36px;height:36px}
.pcell .thumb{width:36px;height:36px;border-radius:7px}
.pcell .plink{line-height:19px}
.pcell .info{margin-top:3px;line-height:16px}
.pcell .ptag{margin-top:2px}
.info{display:grid;grid-template-columns:136px 14px 126px 14px 170px 14px minmax(0,1fr);align-items:baseline;font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px}
.info > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .sep{color:var(--line-strong);text-align:center;overflow:visible}
.pinfo-btn .info{display:inline-grid;margin:0;vertical-align:middle;text-align:left}
.pcell .no{flex:none;min-width:20px;font-size:11.5px;font-weight:500;color:var(--faint)}
.pcell .pbody{min-width:0;flex:1}
.thumb{flex:none;width:40px;height:40px;border-radius:7px;border:1px solid var(--line);background:#fff;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;padding:0}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .ph{font-size:15px;font-weight:700;color:var(--faint);background:var(--sunk);width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.thumb.sm{width:64px;height:64px;border-radius:9px}
button.thumb{cursor:pointer}
button.thumb:hover{border-color:var(--accent)}
.pcat{font-weight:700;color:var(--pc)}
.pinfo-btn{font-size:12.5px}
.plink .no{display:inline-block;min-width:22px;margin-right:6px;font-size:11.5px;font-weight:500;color:var(--faint)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--fg);font-size:16px}
#btn-share{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--accent-soft));color:var(--accent);font-weight:600}
#btn-share:hover{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.filters{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dd{position:relative;display:flex;align-items:center;gap:8px}
.dd-btn{height:30px;min-width:118px;display:inline-flex;align-items:center;justify-content:space-between;gap:10px;padding:0 10px 0 12px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--fg);font-size:12.5px;cursor:pointer}
.dd-btn .num{opacity:.6;font-size:11px;margin-left:4px}
.dd-btn .caret{font-size:9px;color:var(--muted);transition:transform .15s}
.dd-menu{display:none;position:absolute;top:100%;right:0;min-width:100%;padding-top:4px;z-index:30}
.dd-menu .dd-list{background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;max-height:60vh;overflow:auto}
.dd-menu button{display:flex;justify-content:space-between;gap:14px;align-items:center;height:30px;padding:0 10px;border:0;border-radius:5px;background:none;color:var(--fg);font-size:12.5px;text-align:left;cursor:pointer;white-space:nowrap}
.dd-menu button:hover,.dd-menu button:focus-visible{background:var(--sunk);outline:none}
.dd-menu button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dd-menu button .num{opacity:.6;font-size:11px}
.dd:hover .dd-menu,.dd:focus-within .dd-menu{display:block}
.dd:hover .caret,.dd:focus-within .caret{transform:rotate(180deg)}
.dd.shut .dd-menu{display:none!important}
.dd.shut .caret{transform:none!important}
.flabel{font-size:11.5px;color:var(--muted);align-self:center;margin-right:2px;letter-spacing:.04em}
.chip .num{opacity:.6;font-size:11px}
.ptag{font-size:11px;color:var(--accent);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptag.inline{margin:0;padding:2px 8px;border-radius:999px;background:var(--accent-soft)}
@media (max-width:900px){.filters{align-items:flex-start}}
.tabs{display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--line-strong);margin-bottom:10px;flex-wrap:wrap;position:relative}
.urg-legend{position:absolute;bottom:5px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.urg-legend .urg-scale{margin:0 5px 0 4px}
.tab{padding:7px 14px;border:1px solid transparent;border-bottom:0;border-radius:7px 7px 0 0;text-decoration:none;font-weight:600;font-size:13.5px;color:var(--muted);margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);background:var(--surface);border-color:var(--line-strong)}
.tab .num{font-weight:500;font-size:12px;opacity:.65;margin-left:2px}
.tabnote{margin-left:auto;font-size:12px;color:var(--faint);padding-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* PRODUCT */
.ptools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1 1 640px;min-width:0;justify-content:flex-end}
.seg button{white-space:nowrap}
.tipnote{flex:0 0 100%;font-size:11px;line-height:1.2;color:var(--faint);margin:-4px 0 -6px}
.pmeta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pmeta input{width:96px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:var(--surface)}
.hint{font-size:12px;color:var(--faint)}
.gantt{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);position:relative;margin-top:8px;margin-bottom:10px;overscroll-behavior:contain}
.ginner{position:relative}
.ghead{position:sticky;top:0;z-index:6;display:flex;background:var(--surface);border-bottom:1px solid var(--line-strong)}
.gcorner{position:sticky;left:0;z-index:7;flex:none;background:var(--surface);border-right:1px solid var(--line-strong);display:flex;align-items:flex-end;padding:0 10px 4px;font-size:11px;color:var(--muted);letter-spacing:.04em;gap:8px}
.gscale{position:relative;flex:none;height:38px;overflow:hidden}
.gscale .mo{position:absolute;top:0;height:19px;border-left:1px solid var(--line);padding:2px 6px;font-size:11.5px;line-height:15px;font-weight:600;white-space:nowrap;overflow:hidden}
.gscale .dy{position:absolute;top:19px;height:19px;border-left:1px solid var(--line);font-size:10.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;overflow:hidden}
.gscale .dy.we{color:var(--c1)}
.gscale .dy.hol{color:var(--today)}
.gscale .todaytag{position:absolute;top:20px;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;background:var(--today);padding:1px 5px;border-radius:3px;z-index:2;white-space:nowrap}
.gbody{position:relative}
.bglayer{position:absolute;top:0;bottom:0;pointer-events:none;z-index:0}
.bglayer .col{position:absolute;top:0;bottom:0}
.bglayer .col.we{background:var(--weekend)}
.bglayer .col.hol{background:var(--holiday)}
.bglayer .mline{position:absolute;top:0;bottom:0;width:0;border-left:1px solid color-mix(in srgb,var(--line-strong) 75%,transparent)}
.gcorner,.glabel{box-sizing:border-box}

/* ---------- claude-db-compatible wrapper over Firestore ---------- */
const wrapDoc = s => ({ id: s.id, exists: s.exists(), data: () => s.data() });

  return { id: r.id,

window.npdpImport = async function(file, log){
  if (!ME || ME.role !== "admin") throw new Error("admin only");
  const data = JSON.parse(await file.text()); let n = 0, f = 0;
  for (const [id, it] of Object.entries(data.files || {})) { const bin = atob(it.b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    await putFile(id, new Blob([u8], { type: it.type }), it.type, ME.email); f++; log("파일 " + f); }
  const writes = []; for (const [path, docs] of Object.entries(data.collections || {})) for (const [id, v] of Object.entries(docs)) writes.push([path + "/" + id, v]);
  for (let i = 0; i < writes.length; i += 400) { const b = writeBatch(fdb); writes.slice(i, i + 400).forEach(([p, v]) => b.set(doc(fdb, p), v)); await b.commit(); n += Math.min(400, writes.length - i); log("문서 " + n + "/" + writes.length); }
  return { docs: n, files: f };
};
window.npdpImportRaw = async function(id, file, type){
  if (!ME || ME.role !== "admin") throw new Error("admin only");
  if (!/^[0-9a-f]{32}$/.test(id)) throw new Error("bad id");
  await putFile(id, file, type || file.type || "application/octet-stream", ME.email); return { id, size: file.size };
};

  { const ia=a.info||{}, ib=b.info||{}; [["cat","카테고리"],["channel","채널"],["moq","MOQ"],["sales","매출액"]].forEach(([k,n])=>{ if((ia[k]||"")!==(ib[k]||"")) out.push(n+": "+(ia[k]||"없음")+" → "+(ib[k]||"없음")); }); }
  if ((a.expect||"")!==(b.expect||"")) out.push("예상 런칭 시기: "+(a.expect||"없음")+" → "+(b.expect||"없음"));
  if ((a.owner||"")!==(b.owner||"")) out.push("담당: "+(a.owner||"없음")+" → "+(b.owner||"없음"));
  const ta=new Map((a.tasks||[]).map(t=>[t.id,t])), tb=new Map((b.tasks||[]).map(t=>[t.id,t]));
  for (const [id,t] of ta) if (!tb.has(id)) out.push("공정 삭제: "+t.proc+((t.bars||[]).length?" (일정 "+t.bars.length+"건 포함)":""));
  for (const [id,t] of tb) if (!ta.has(id)) out.push("공정 추가: "+t.proc+" ("+t.main+")");
  for (const [id,t2] of tb){ const t1=ta.get(id); if(!t1) continue;
    if (t1.proc!==t2.proc) out.push("공정명: "+t1.proc+" → "+t2.proc);
    if (t1.main!==t2.main||t1.sub!==t2.sub) out.push("분류 변경: "+t2.proc+" → "+t2.main+" › "+t2.sub);
    const ba=new Map((t1.bars||[]).map(x=>[x.id,x])), bb=new Map((t2.bars||[]).map(x=>[x.id,x]));
    for (const [bid,x] of ba) if(!bb.has(bid)) out.push("일정 삭제: "+t2.proc+" "+fmtRange(x)+(x.label?" ("+x.label+")":""));
    for (const [bid,y] of bb){ const x=ba.get(bid);
      if(!x){ out.push("일정 추가: "+t2.proc+" "+fmtRange(y)+(y.label?" ("+y.label+")":"")); continue; }
      if (x.start!==y.start||x.end!==y.end) out.push(t2.proc+": "+fmtRange(x)+" → "+fmtRange(y));
      if ((x.label||"")!==(y.label||"")) out.push(t2.proc+" 내용: "+(x.label||"없음")+" → "+(y.label||"없음"));
      if (!!x.done!==!!y.done) out.push(t2.proc+(y.done?" 완료 표시":" 완료 해제"));
    }
  }
  const oa=(a.tasks||[]).map(t=>t.id).filter(id=>tb.has(id)).join(), ob=(b.tasks||[]).map(t=>t.id).filter(id=>ta.has(id)).join();
  if (oa!==ob) out.push("공정 순서 변경");
  return out;
}
async function prune(col, keep){
  try { const all = await S.db.collection(col).orderBy("at","asc").get(); const n=all.docs.length-keep;
    for (let i=0;i<n;i++) await all.docs[i].ref.delete(); } catch(e){}
}
async function recordChange(pid, beforeStr, kind){
  if (!S.db) return;
  const before = beforeStr ? JSON.parse(beforeStr) : null, after = S.products[pid] ? clean(S.products[pid]) : null;
  const lines = diffLines(before, after); if (!lines.length) return;
  const at = new Date().toISOString(), by = S.me || null, name = (after||before).name;
  try {
    if (before && (kind==="restore" || !lastSnap[pid] || Date.now()-lastSnap[pid] > SNAP_GAP)) {
      lastSnap[pid] = Date.now();
      await S.db.collection("versions/"+pid+"/snaps").add({at, by, name, kind: kind||"edit", data: beforeStr});
      if (Math.random()<0.2) prune("versions/"+pid+"/snaps", SNAP_KEEP);
    }
    if (!after && before) await S.db.doc("deleted/"+pid).set({at, by, name, data: beforeStr});
    if (after && kind==="revive") { try { await S.db.doc("deleted/"+pid).delete(); } catch(e){} }
    await S.db.collection("logs/"+pid+"/entries").add({at, by, name, kind: kind||"edit", lines: lines.slice(0,12), more: Math.max(0, lines.length-12)});
    if (Math.random()<0.1) prune("logs/"+pid+"/entries", LOG_KEEP);
  } catch(e) { /* history is best-effort; the edit itself already saved */ }
}

function allBars(p){ const r=[]; (p.tasks||[]).forEach(t=>(t.bars||[]).forEach(b=>r.push({t,b}))); return r; }
function launchOf(p){
  let best=null;
  (p.tasks||[]).forEach(t=>{ if(/런칭/.test(t.proc)) (t.bars||[]).forEach(b=>{ const s=dn(b.start); if(best===null||s<best) best=s; }); });
  return best;
}
function expectDay(p){ const m=/^(\d{4})-(\d{2})$/.exec(p.expect||""); return m ? Math.round(Date.UTC(+m[1], +m[2]-1, 1)/DAY) : null; }
function isStarted(p){ const r=rangeOf(p); return (!!r && r[0] <= TODAY) ? 1 : 0; }

const URG_DAYS = 90;
function placeUrgLegend(){ const lg=document.getElementById("urg-legend"); if(!lg) return; const hc=document.querySelector(".prow.head > div:nth-child(2)");

  return ' urg'+(u>=55?' hot':'')+'" style="--u:'+u+'%'; }

function sortDay(p){ const L=launchOf(p); return L!==null ? L : (expectDay(p) ?? 1e9); }
function qOf(p){ const L=launchOf(p); if(L===null) return "미정"; const d=new Date(L*DAY); return d.getUTCFullYear()+" "+(Math.floor(d.getUTCMonth()/3)+1)+"Q"; }
function planTag(p){ const pl=p.plan; if(!pl) return ""; const bits=[pl.roadmapName&&pl.roadmapName!==p.name?"로드맵명 "+pl.roadmapName:"", pl.line, pl.channel, pl.target].filter(Boolean);
  return '<div class="ptag" title="'+esc(pl.source||"")+'">'+esc(bits.join(" · "))+'</div>'; }
function nextOf(p){
  let best=null;
  allBars(p).forEach(({t,b})=>{ if(b.done) return; const e=dn(b.end), s=dn(b.start); if(e<TODAY) return;
    if(!best || s<best.s) best={s,e,t,b}; });

}
function rangeOf(p){
  let lo=null, hi=null;
  allBars(p).forEach(({b})=>{ const s=dn(b.start), e=dn(b.end); if(lo===null||s<lo) lo=s; if(hi===null||e>hi) hi=e; });
  return lo===null ? null : [lo,hi];
}

    let segs="";
    (p.tasks||[]).forEach(t=>{ const ci=catIdx(p,t.main); (t.bars||[]).forEach(b=>{
      let s=dn(b.start), e=dn(b.end)+1; if(e<lo||s>hi) return; s=Math.max(s,lo); e=Math.min(e,hi);
      segs+='<div class="seg2" style="left:'+pct(s)+'%;width:max(2px,'+(pct(e)-pct(s))+'%);background:var(--c'+(ci%7)+')" title="'+esc(t.proc+(b.label?" · "+b.label:""))+'"></div>'; }); });
    if (L!==null && L>=lo && L<=hi) segs+='<div class="launch" style="left:'+pct(L)+'%" title="런칭 '+md(L)+'"></div>';
    const nTasks=(p.tasks||[]).length, nWith=(p.tasks||[]).filter(t=>(t.bars||[]).length).length;

    rows += '<div class="prow'+(started?' started':'')+'"><div class="pcell"><span class="no num">'+String(rank[p.id]).padStart(2,"0")+'</span><a class="tlink" href="#p-'+p.id+'" tabindex="-1" aria-hidden="true">'+thumb(p)+'</a><div class="pbody"><a class="plink" href="#p-'+p.id+'">'+esc(p.name)+'</a>'+infoHtml(p)+planTag(p)+'</div></div>'+
      '<div>'+dday+'</div><div class="owner">'+esc(p.owner||"—")+'</div><div class="next">'+next+'</div>'+
      '<div><a href="#p-'+p.id+'" class="strip" style="display:block" aria-label="'+esc(p.name)+' 일정 열기">'+mdivs+'<div class="lane"></div>'+segs+
      (TODAY>=lo&&TODAY<=hi?'<div class="tl" style="left:'+pct(TODAY)+'%"></div>':'')+'</a></div></div>';
  });
  const edges=[lo, ...ticks, hi];
  let yrow="", mrow="";
  for (let k=0;k<edges.length-1;k++){
    const a=edges[k], z=edges[k+1], d=new Date(a*DAY), m=d.getUTCMonth()+1, isJan = k>0 && m===1;

  }

/* ---------- PRODUCT (gantt) ---------- */
function labelW(){ return window.innerWidth < 640 ? 150 : 262; }
function viewRange(p){
  const r = rangeOf(p);
  let lo = r ? (r[0]-TODAY > 45 ? r[0] : Math.min(r[0], TODAY)) - 10 : TODAY-14, hi = r ? (TODAY-r[1] > 45 ? r[1] : Math.max(r[1], TODAY)) + 30 : TODAY+150;
  if (S.drag) { lo = Math.min(lo, S.drag.lo); hi = Math.max(hi, S.drag.hi); }
  return [lo, hi];
}
function pxPerDay(lo, hi){
  const fixed = {day:30, week:11, month:3.6}[S.zoom];
  if (fixed) return fixed;
  const box = document.getElementById("main").clientWidth - labelW() - 24;
  return Math.max(2.2, Math.min(36, box/(hi-lo+1)));
}
function groups(p){
  const g=[]; (p.tasks||[]).forEach((t,i)=>{ const last=g[g.length-1]; if(!last||last.main!==t.main) g.push({main:t.main, items:[]}); g[g.length-1].items.push(i); });
  g.forEach(x=>{ x.ci=catOf(x.main); });
  return g;
}

function renderProduct(pid){
  const p = S.products[pid];
  const main = document.getElementById("main");
  const keepScroll = main.querySelector(".gantt");
  const prev = keepScroll ? {x:keepScroll.scrollLeft, y:keepScroll.scrollTop, pid:keepScroll.dataset.pid} : null;
  const [lo, hi] = viewRange(p);
  const px = pxPerDay(lo, hi), LW = labelW(), days = hi-lo+1, TW = Math.ceil(days*px);
  S.view = {pid, lo, hi, px, LW};
  const x = n => (n-lo)*px;

  // header scale
  let scale = "";
  { const d=new Date(lo*DAY); d.setUTCDate(1);
    while (d.getTime()/DAY <= hi) {
      const a=Math.max(lo, Math.round(d.getTime()/DAY)); const nm=new Date(d); nm.setUTCMonth(nm.getUTCMonth()+1);
      const b=Math.min(hi+1, Math.round(nm.getTime()/DAY)); const m=d.getUTCMonth()+1;
      const wpx=(b-a)*px; const txt = wpx < 34 ? (wpx<16?"":m+"") : ((m===1||a===lo)&&wpx>=78 ? d.getUTCFullYear()+"년 ":"")+m+"월";
      scale += '<div class="mo" style="left:'+x(a)+'px;width:'+(b-a)*px+'px">'+txt+'</div>'; d.setUTCMonth(d.getUTCMonth()+1); } }
  if (px >= 16) { for (let n=lo;n<=hi;n++){ const w=wday(n), hol=HOLIDAYS.has(ds(n));
      scale += '<div class="dy num '+(hol?"hol":(w===0||w===6?"we":""))+'" style="left:'+x(n)+'px;width:'+px+'px">'+new Date(n*DAY).getUTCDate()+'</div>'; } }
  else if (px >= 5) { for (let n=lo;n<=hi;n++) if (wday(n)===1) scale += '<div class="dy num" style="left:'+x(n)+'px;width:'+7*px+'px;justify-content:flex-start;padding-left:3px">'+md(n)+'</div>'; }
  if (TODAY>=lo && TODAY<=hi) scale += '<div class="todaytag" style="left:'+(x(TODAY)+px/2)+'px">오늘</div>';

  // background layer
  let bg = "";
  if (px >= 4) for (let n=lo;n<=hi;n++){ const w=wday(n), hol=HOLIDAYS.has(ds(n)); if(hol||w===0||w===6) bg+='<div class="col '+(hol?"hol":"we")+'" style="left:'+x(n)+'px;width:'+px+'px"></div>'; }
  if (px*7 >= 14) for (let n=lo+((8-wday(lo))%7); n<=hi; n+=7){ if (new Date(n*DAY).getUTCDate()!==1) bg+='<div class="wline" style="left:'+x(n)+'px"></div>'; }
  { const d=new Date(lo*DAY); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+1); while(d.getTime()/DAY<=hi){ bg+='<div class="mline" style="left:'+x(Math.round(d.getTime()/DAY))+'px"></div>'; d.setUTCMonth(d.getUTCMonth()+1);} }
  if (TODAY>=lo && TODAY<=hi) bg += '<div class="tline" style="left:'+(x(TODAY)+px/2-1)+'px"></div>';

  // rows
  let rows = "";
  const gs = groups(p);
  gs.forEach((g, gi)=>{
    const key = pid+"|"+gi+"|"+g.main, closed = !!S.closed[key];
    let gl=null, gh=null, nb=0;
    g.items.forEach(i=>(p.tasks[i].bars||[]).forEach(b=>{ nb++; const s=dn(b.start), e=dn(b.end); if(gl===null||s<gl) gl=s; if(gh===null||e>gh) gh=e; }));
    rows += '<div class="grow grp'+(closed?" closed":"")+'" style="--cat:var(--c'+g.ci+')"><div class="glabel" data-grp="'+esc(key)+'" style="width:'+LW+'px" role="button" tabindex="0" aria-expanded="'+!closed+'">'+
      '<span class="caret" aria-hidden="true">▾</span><span class="dot" style="background:var(--cat)"></span><span class="proc">'+esc(g.main||"(대분류 없음)")+'</span><span class="cnt num">'+(S.hideEmpty?g.items.filter(i=>(p.tasks[i].bars||[]).length).length+"/":"")+g.items.length+'</span>'+
      (S.canWrite?'<span class="ra"><button type="button" class="rab" data-act="addin" data-last="'+p.tasks[g.items[g.items.length-1]].id+'" title="이 대분류에 공정 추가" aria-label="'+esc(g.main)+'에 공정 추가">＋</button></span>':'')+'</div>'+
      '<div class="track" style="width:'+TW+'px">'+(gl!==null?'<div class="grp-span" style="left:'+x(gl)+'px;width:'+(gh-gl+1)*px+'px"></div>':"")+'</div></div>';
    if (closed) return;
    let lastSub = null;
    g.items.forEach(i=>{
      const t = p.tasks[i];
      if (S.hideEmpty && !(t.bars||[]).length) return;
      const subTxt = t.sub!==lastSub ? t.sub : ""; lastSub = t.sub;
      let bars = "";
      const starts=(t.bars||[]).map(b=>dn(b.start)).sort((a,b)=>a-b);
      (t.bars||[]).forEach(b=>{
        const s=dn(b.start), w=Math.max(6, span(b)*px), tw=textW(b.label), fits = tw+10 < w;
        const nxt=starts.find(v=>v>s); const avail = Math.min(260, (nxt===undefined ? TW : x(nxt)) - x(s)-w-8);
        const outStyle = fits ? "" : (avail>=18 ? ' style="max-width:'+Math.floor(avail)+'px"' : ' hidden');
        bars += '<div class="bar'+(b.done?" done":"")+(S.sel&&S.sel.b===b.id?" sel":"")+'" tabindex="0" role="button" data-t="'+t.id+'" data-b="'+b.id+'" style="left:'+x(s)+'px;width:'+w+'px" aria-label="'+esc(t.proc+" "+b.start+"부터 "+b.end+"까지 "+(b.label||""))+'" title="'+esc(md(s)+(b.end!==b.start?" ~ "+md(dn(b.end)):"")+" ("+span(b)+"일)"+(b.label?" · "+b.label:""))+'">'+
          (S.canWrite&&w>=22?'<span class="h l" data-h="l"></span><span class="h r" data-h="r"></span>':"")+'<span class="bl'+(fits?"":" out")+'"'+(b.label?outStyle:"")+'>'+esc(b.label)+(b.done&&!b.label&&w>=14?"✓":"")+'</span></div>';
      });
      rows += '<div class="grow" style="--cat:var(--c'+g.ci+')"><div class="glabel" data-task="'+t.id+'" style="width:'+LW+'px" role="button" tabindex="0" title="'+esc((t.sub?t.sub+" › ":"")+t.proc)+'"><span class="sub">'+esc(subTxt)+'</span><span class="proc">'+esc(t.proc)+'</span>'+
        (S.canWrite?'<span class="ra"><button type="button" class="rab" data-act="below" title="아래에 공정 추가" aria-label="'+esc(t.proc)+' 아래에 공정 추가">＋</button><button type="button" class="rab del" data-act="del" title="공정 삭제" aria-label="'+esc(t.proc)+' 삭제">−</button></span>':'')+'</div>'+
        '<div class="track'+(S.canWrite?" can-edit":"")+'" data-t="'+t.id+'" style="width:'+TW+'px">'+bars+'</div></div>';
    });
  });
  // fit rows to the screen height
  const nG = gs.length, nT = gs.reduce((a,g,gi)=>a + (S.closed[pid+"|"+gi+"|"+g.main] ? 0 : g.items.filter(i=>!S.hideEmpty||(p.tasks[i].bars||[]).length).length), 0);
  const availH = main.clientHeight - 18 - 2 - 39 - nG*20;
  const rowH = Math.max(18, Math.min(26, Math.floor(availH / Math.max(1,nT))));

  const zoomBtns = [["fit","전체"],["month","월"],["week","주"],["day","일"]].map(([k,l])=>'<button type="button" data-zoom="'+k+'" aria-pressed="'+(S.zoom===k)+'">'+l+'</button>').join("");
  const L = launchOf(p);
  document.getElementById("tools").innerHTML =
    '<div class="pmeta"><span>담당 <input id="owner" value="'+esc(p.owner||"")+'" '+(S.canWrite?"":"readonly")+' aria-label="담당자"></span>'+
      '<button type="button" class="dday num launch-btn" id="launch" title="런칭일 변경">'+(L===null?"런칭일 설정":(L>=TODAY?"런칭 "+md(L)+" · D-"+(L-TODAY):"런칭 "+md(L)))+' <span aria-hidden="true">✎</span></button>'+
      '<button type="button" class="btn pinfo-btn" id="pinfo" title="카테고리·채널·MOQ·매출액·이미지">'+infoHtml(p)+' <span aria-hidden="true">✎</span></button>'+
      (p.plan?'<span class="ptag inline">'+esc([p.plan.year+" "+p.plan.quarter+" 출시 계획", p.plan.line, p.plan.channel, p.plan.target].join(" · "))+'</span>':'')+
      (S.canWrite && !allBars(p).length ? '<span class="hint" style="color:var(--accent)">공정 줄의 빈 칸을 끌거나 더블클릭해 첫 일정을 만드세요</span>' : '')+
      '</div><div class="spacer"></div>'+
      '<div class="seg" role="group" aria-label="보기 단위">'+zoomBtns+'</div>'+
      '<button class="btn" type="button" id="go-today">오늘</button>'+
      '<button class="btn" type="button" id="hide-empty" aria-pressed="'+!!S.hideEmpty+'">빈 공정 숨기기</button>'+
      '<button class="btn" type="button" id="fold-all">'+(gs.every((g,gi)=>S.closed[pid+"|"+gi+"|"+g.main])?"모두 펼치기":"모두 접기")+'</button>'+
      (S.canWrite?'<button class="btn" type="button" id="add-task">＋ 공정</button><button class="btn" type="button" id="bulk">일괄 이동</button>':'')+
      '<button class="btn" type="button" id="csv">CSV</button>'+
      (S.canWrite?'<button class="btn ghost" type="button" id="undo" title="Ctrl+Z">되돌리기</button>':'')+
      '<button class="btn ghost" type="button" id="hist">변경 기록</button>'+
      '<button class="btn ghost" type="button" id="help">사용법</button>'+
      (S.canWrite?'<button class="btn ghost danger" type="button" id="del-prod">제품 삭제</button>':'')+

  main.innerHTML =
    '<div class="gantt'+(S.canWrite?"":" ro")+'" data-pid="'+pid+'" style="--rowh:'+rowH+'px"><div class="ginner" style="width:'+(LW+TW)+'px">'+
      '<div class="ghead"><div class="gcorner" style="width:'+LW+'px"><span>대분류 › 중분류 · 공정</span></div><div class="gscale" style="width:'+TW+'px">'+scale+'</div></div>'+
      '<div class="gbody"><div class="bglayer" style="left:'+LW+'px;width:'+TW+'px">'+bg+'</div>'+rows+'</div></div></div>';

  const gantt = main.querySelector(".gantt");

function bindProduct(p, gantt){
  const main = document;
  main.querySelector("#help").addEventListener("click",openHelp);
  main.querySelector("#hist").addEventListener("click",()=>openHistory(p));
  main.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>{ S.zoom=b.dataset.zoom; try{localStorage.setItem("npdp-zoom",S.zoom);}catch(e){} const g=main.querySelector(".gantt"); if(g) g.dataset.pid=""; render(); }));
  main.querySelector("#go-today").addEventListener("click",()=>{ const v=S.view; gantt.scrollTo({left:Math.max(0,(TODAY-v.lo)*v.px-160), behavior:"smooth"}); });
  main.querySelector("#csv").addEventListener("click",()=>exportCsv(p));
  main.querySelector("#hide-empty").addEventListener("click",()=>{ S.hideEmpty=!S.hideEmpty; try{localStorage.setItem("npdp-hide",S.hideEmpty?"1":"0");}catch(e){} render(); });
  main.querySelector("#fold-all").addEventListener("click",()=>{ const gs=groups(p); const keys=gs.map((g,gi)=>p.id+"|"+gi+"|"+g.main); const all=keys.every(k=>S.closed[k]); keys.forEach(k=>{ S.closed[k]=!all; }); render(); });
  main.querySelector("#bulk")?.addEventListener("click",()=>openBulk(p));
  main.querySelector("#undo")?.addEventListener("click",undo);
  main.querySelector("#del-prod")?.addEventListener("click",()=>openDeleteProduct(p));
  const ow = main.querySelector("#owner");
  ow.addEventListener("change",()=>{ const v=ow.value.trim(); if(v===p.owner) return; commit(p.id,()=>{p.owner=v;},"담당자를 바꿨습니다."); });
  main.querySelector("#add-task")?.addEventListener("click",()=>openTask(p,null));
  main.querySelector("#pinfo").addEventListener("click",()=>openInfo(p));
  watchDetails(p.id);
  main.querySelector("#launch").addEventListener("click",()=>{ if(S.canWrite) openLaunch(p); else toast("보기 전용 권한입니다."); });
  gantt.querySelectorAll(".rab").forEach(btn=>btn.addEventListener("click",e=>{
    e.stopPropagation();

/* ---------- drag engine ---------- */
let tip;
function showTip(e, html){ if(!tip){ tip=document.createElement("div"); tip.className="dragtip"; document.body.appendChild(tip);} tip.innerHTML=html; tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY+16)+"px"; }
function hideTip(){ tip?.remove(); tip=null; }
function onDown(e, p, gantt){
  if (e.button!==0) return;
  if (S.drag) { S.drag=null; hideTip(); }
  const barEl = e.target.closest(".bar");
  const tr = e.target.closest(".track[data-t]");
  if (barEl) {
    const {t,b} = findBar(p, barEl.dataset.t, barEl.dataset.b); if (!b) return;
    S.sel = {t:t.id, b:b.id};
    const mode = !S.canWrite ? "view" : (e.target.dataset.h==="l" ? "l" : e.target.dataset.h==="r" ? "r" : "move");
    S.drag = {mode, p, t, b, el:barEl, x0:e.clientX, s0:dn(b.start), e0:dn(b.end), moved:false, lo:S.view.lo, hi:S.view.hi, cascade:e.shiftKey};
    if (S.canWrite) { barEl.setPointerCapture(e.pointerId); e.preventDefault(); }
  } else if (tr && S.canWrite && e.pointerType!=="touch") {
    const n = dayAt(e, tr);
    const ghost = document.createElement("div"); ghost.className="bar ghost"; ghost.style.left=((n-S.view.lo)*S.view.px)+"px"; ghost.style.width=S.view.px+"px"; ghost.hidden=true; tr.appendChild(ghost);
    S.drag = {mode:"create", p, t:p.tasks.find(t=>t.id===tr.dataset.t), el:ghost, tr, x0:e.clientX, n0:n, moved:false, lo:S.view.lo, hi:S.view.hi};
    tr.setPointerCapture(e.pointerId); e.preventDefault();
  } else return;
  const move = ev => onMove(ev);
  const up = ev => { window.removeEventListener("pointermove",move,true); window.removeEventListener("pointerup",up,true); window.removeEventListener("pointercancel",up,true); onUp(ev, p); };
  window.addEventListener("pointermove", move, true);
  window.addEventListener("pointerup", up, true);
  window.addEventListener("pointercancel", up, true);
}
function onMove(e){
  const d = S.drag; if (!d || d.mode==="view") return;
  const dx = e.clientX - d.x0; if (!d.moved && Math.abs(dx) < 4) return;
  d.moved = true;
  const px = S.view.px, dd = Math.round(dx/px), x = n => (n - S.view.lo)*px;
  if (d.mode==="create") {
    const n1 = d.n0 + Math.floor(dx/px + (dx>0?0.5:-0.5)); const a=Math.min(d.n0,n1), b=Math.max(d.n0,n1);
    d.ns=a; d.ne=b; d.el.hidden=false; d.el.style.left=x(a)+"px"; d.el.style.width=(b-a+1)*px+"px";
    showTip(e, mdw(a)+" ~ "+mdw(b)+" · <b>"+(b-a+1)+"일</b>");
    return;
  }
  let s=d.s0, en=d.e0;
  if (d.mode==="move") { s+=dd; en+=dd; }
  else if (d.mode==="l") s = Math.min(d.s0+dd, d.e0);
  else if (d.mode==="r") en = Math.max(d.e0+dd, d.s0);
  d.ns=s; d.ne=en; d.cascade = d.cascade || e.shiftKey;
  d.el.classList.add("dragging");
  d.el.style.left = x(s)+"px"; d.el.style.width = Math.max(6,(en-s+1)*px)+"px";
  const shift = s - d.s0;
  const Ld=launchOf(d.p);
  showTip(e, mdw(s)+" ~ "+mdw(en)+" · <b>"+(en-s+1)+"일</b>"+(d.mode==="move"&&shift?" ("+(shift>0?"+":"")+shift+"일)":"")+(Ld!==null&&!isLaunchTask(d.t)?" · 런칭 D-"+(Ld-s):"")+
    (d.mode==="move"&&d.cascade&&shift?"<br>이후 일정도 함께 이동":""));
}
function onUp(e, p){
  const d = S.drag; S.drag = null; hideTip();
  if (!d) return;
  if (d.mode==="create") {
    d.el.remove();
    if (d.moved && d.ns!==undefined) {
      const b = {id:uid("b"), start:ds(d.ns), end:ds(d.ne), label:"", done:false};
      commit(p.id, ()=>{ d.t.bars=d.t.bars||[]; d.t.bars.push(b); }, "일정을 추가했습니다.");
      openBar(p, d.t.id, b.id);
    }
    if (S.pendingRender) render();
    return;
  }
  if (!d.moved) { if (S.pendingRender) render(); openBar(p, d.t.id, d.b.id); return; }
  if (d.ns===d.s0 && d.ne===d.e0) { render(); return; }
  const shift = d.ns - d.s0;
  commit(p.id, ()=>{
    if (d.mode==="move" && d.cascade && shift) {
      allBars(p).forEach(({b})=>{ if (b!==d.b && dn(b.start) > d.s0) { b.start=ds(dn(b.start)+shift); b.end=ds(dn(b.end)+shift); } });
    }
    d.b.start = ds(d.ns); d.b.end = ds(d.ne);
  }, d.mode==="move" ? (d.cascade&&shift ? "이후 일정까지 "+Math.abs(shift)+"일 "+(shift>0?"뒤로":"앞으로")+" 옮겼습니다." : mdw(d.ns)+"로 옮겼습니다.") : "기간을 "+(d.ne-d.ns+1)+"일로 조정했습니다.");
}
function barKey(e, p, el){
  const {t,b} = findBar(p, el.dataset.t, el.dataset.b); if (!b) return;
  if (e.key==="Enter") { e.preventDefault(); openBar(p,t.id,b.id); return; }
  if (!S.canWrite) return;
  let ds_=0, de=0;
  if (e.key==="ArrowLeft") { if(e.shiftKey) de=-1; else { ds_=-1; de=-1; } }
  else if (e.key==="ArrowRight") { if(e.shiftKey) de=1; else { ds_=1; de=1; } }
  else if (e.key==="Delete"||e.key==="Backspace") { e.preventDefault(); commit(p.id,()=>{ t.bars=t.bars.filter(x=>x!==b); },"일정을 삭제했습니다."); return; }
  else return;
  e.preventDefault();
  const ns=dn(b.start)+ds_, ne=Math.max(ns, dn(b.end)+de);
  commit(p.id,()=>{ b.start=ds(ns); b.end=ds(ne); });
  requestAnimationFrame(()=>document.querySelector('.bar[data-b="'+b.id+'"]')?.focus());
}

/* ---------- backward scheduling helpers ---------- */
const isOff = n => { const w=wday(n); return w===0||w===6||HOLIDAYS.has(ds(n)); };
const prevWork = n => { let k=0; while(isOff(n) && k++<30) n--; return n; };
const isLaunchTask = t => /런칭/.test(t.proc||"");
function anchorOf(p){ const L=launchOf(p); if(L!==null) return {n:L, kind:"launch"}; const r=rangeOf(p); return r?{n:r[1],kind:"end"}:null; }
function shiftBar(b, shift, snap, keepDone){
  let s=dn(b.start)+shift, e=dn(b.end)+shift;
  if (snap && isOff(s)) { const s2=prevWork(s); e-=(s-s2); s=s2; }
  return {id:uid("b"), start:ds(s), end:ds(e), label:b.label||"", done:keepDone?!!b.done:false};
}
function launchTaskOf(p, create){
  let t = p.tasks.find(isLaunchTask);
  if (!t && create) {
    let at=-1; p.tasks.forEach((x,i)=>{ if(/마케팅/.test(x.main)) at=i; });
    t = {id:uid("t"), main: at>=0 ? p.tasks[at].main : "마케팅 콘텐츠", sub:"런칭 프로모션", proc:"런칭예정일", bars:[]};
    if (at<0) p.tasks.push(t); else p.tasks.splice(at+1,0,t);
  }
  return t;
}

function openNewProduct(){
  const list = sorted();
  const withBars = list.filter(p=>allBars(p).length).sort((a,b)=>(launchOf(b)!==null)-(launchOf(a)!==null));
  const defL = prevWork(TODAY+120);
  drawer('<h3>신제품 추가</h3>'+
    '<div class="field"><label for="n-name">제품명</label><input id="n-name" placeholder="예: 콜라겐 젤리스틱"></div>'+
    '<div class="row2"><div class="field"><label for="n-owner">담당자</label><input id="n-owner" list="dl-owner"><datalist id="dl-owner">'+[...new Set(list.map(p=>p.owner).filter(Boolean))].map(o=>'<option value="'+esc(o)+'">').join("")+'</datalist></div>'+
    '<div class="field"><label for="n-launch">런칭 예정일</label><input type="date" id="n-launch" value="'+ds(defL)+'"></div></div>'+
    '<div class="field"><label>일정 만드는 방법</label><div class="radio-list">'+
      '<label><input type="radio" name="n-mode" value="copy" '+(withBars.length?"checked":"disabled")+'><span>기존 제품 일정을 런칭일에 맞춰 역산<small>고른 제품의 공정·기간을 그대로 가져와, 그 제품의 런칭일이 새 런칭일에 오도록 모든 일정을 옮깁니다.</small></span></label>'+
      '<label><input type="radio" name="n-mode" value="tmpl" '+(withBars.length?"":"checked")+'><span>표준 공정만 (일정 비움)<small>NPDP 표준 '+TEMPLATE.length+'개 공정에 런칭일만 표시합니다. 나머지 일정은 직접 그립니다.</small></span></label></div></div>'+
    '<div id="copy-opts"><div class="field"><label for="n-src">기준으로 삼을 제품</label><select id="n-src">'+withBars.map(p=>{ const a=anchorOf(p), r=rangeOf(p);
        return '<option value="'+p.id+'">'+esc(p.name)+' · '+(a.kind==="launch"?"런칭 "+md(a.n):"런칭일 없음")+' · 총 '+(a.n-r[0]+1)+'일</option>'; }).join("")+'</select></div>'+
      '<label class="check" style="margin-top:10px"><input type="checkbox" id="n-snap" checked> 주말·휴무일에 시작하게 되는 일정은 직전 근무일로 당김</label></div>'+
    '<div class="note" id="n-prev"></div>'+
    '<details class="pick" id="n-pick"><summary id="n-pick-sum"></summary><div class="pick-hint">제품 유형·포장형태에 해당하지 않는 공정은 체크를 해제하세요. 만든 뒤에도 공정 줄의 ＋/− 버튼으로 언제든 추가·삭제할 수 있습니다.</div><div id="n-pick-list"></div></details>'+
    '<div class="dactions"><button class="btn primary" id="n-create" type="button">만들기</button><div class="spacer"></div><button class="btn ghost" data-close type="button">취소</button></div>',
  d=>{
    const $=q=>d.querySelector(q);
    const mode=()=>d.querySelector('input[name="n-mode"]:checked')?.value||"tmpl";
    const src=()=>S.products[$("#n-src")?.value];
    let rows=[], srcKey=null;
    const buildPick=()=>{
      const key = mode()==="copy" ? "c:"+(src()?.id||"") : "t";
      if (key===srcKey) return; srcKey=key;
      rows = mode()==="copy" && src() ? src().tasks.map(t=>({main:t.main,sub:t.sub,proc:t.proc,n:(t.bars||[]).length})) : TEMPLATE.map(t=>({...t,n:0}));
      const gs=[]; rows.forEach((r,i)=>{ const g=gs[gs.length-1]; if(!g||g.main!==r.main) gs.push({main:r.main,items:[]}); gs[gs.length-1].items.push(i); });
      $("#n-pick-list").innerHTML = gs.map((g,gi)=>'<div class="pick-g"><label class="pick-gh"><input type="checkbox" data-g="'+gi+'" checked><span class="dot" style="background:var(--c'+catOf(g.main)+')"></span><b>'+esc(g.main)+'</b></label>'+
        g.items.map(i=>'<label class="pick-i"><input type="checkbox" data-i="'+i+'" data-gi="'+gi+'" checked><span class="sub">'+esc(rows[i].sub)+'</span><span>'+esc(rows[i].proc)+'</span>'+(rows[i].n?'<small class="num">'+rows[i].n+'건</small>':'')+'</label>').join("")+'</div>').join("");
      $("#n-pick-list").querySelectorAll("[data-g]").forEach(c=>c.addEventListener("change",()=>{ $("#n-pick-list").querySelectorAll('[data-gi="'+c.dataset.g+'"]').forEach(x=>x.checked=c.checked); sum(); }));
      $("#n-pick-list").querySelectorAll("[data-i]").forEach(c=>c.addEventListener("change",()=>{ const all=[...$("#n-pick-list").querySelectorAll('[data-gi="'+c.dataset.gi+'"]')]; const gh=$('#n-pick-list [data-g="'+c.dataset.gi+'"]'); gh.checked=all.some(x=>x.checked); gh.indeterminate=gh.checked&&!all.every(x=>x.checked); sum(); }));
      sum();
    };
    const picked=()=>[...$("#n-pick-list").querySelectorAll("[data-i]")].filter(c=>c.checked).map(c=>+c.dataset.i);
    const sum=()=>{ $("#n-pick-sum").textContent = "공정 구성 · "+picked().length+"/"+rows.length+"개 포함 (펼쳐서 선택)"; };
    const plan=()=>{
      const L = $("#n-launch").value ? dn($("#n-launch").value) : null;
      if (mode()!=="copy" || !src()) return {L, shift:0};
      const a=anchorOf(src()); return {L, a, shift: L===null?0:L-a.n};
    };
    const upd=()=>{
      $("#copy-opts").hidden = mode()!=="copy";
      buildPick();
      const pr=$("#n-prev"), {L,a,shift}=plan();
      pr.classList.remove("warn");
      if (L===null) { pr.textContent="런칭 예정일을 입력하면 그날을 기준으로 일정을 거꾸로 계산합니다."; return; }
      if (mode()!=="copy") { pr.textContent="런칭 "+mdw(L)+" (D-"+(L-TODAY)+")을 표시한 빈 일정표를 만듭니다."; return; }
      const s=src(), sel=new Set(picked()); const snap=$("#n-snap").checked;
      let first=null; s.tasks.forEach((t,i)=>{ if(!sel.has(i)) return; (t.bars||[]).forEach(b=>{ const nb=shiftBar(b,shift,snap&&!isLaunchTask(t)); const v=dn(nb.start); if(first===null||v<first) first=v; }); });
      let txt = (a.kind==="launch" ? "기준 제품 런칭 "+md(a.n) : "기준 제품의 마지막 일정 "+md(a.n)+"(런칭일 없음)")+" → 새 런칭 "+mdw(L)+" ("+(shift>=0?"+":"")+shift+"일 이동).";
      if (first!==null) txt += " 첫 일정은 "+mdw(first)+", 런칭 D-"+(L-first)+"부터 시작합니다. 완료 표시는 지워집니다.";
      if (first!==null && first<TODAY) { pr.classList.add("warn"); txt += " 첫 일정이 오늘보다 "+(TODAY-first)+"일 앞서 있어 그대로는 일정이 부족합니다. 런칭일을 늦추거나, 만든 뒤 앞쪽 일정을 줄이세요."; }
      pr.textContent = txt;
    };
    d.querySelectorAll('input[name="n-mode"],#n-src,#n-launch,#n-snap').forEach(el=>el.addEventListener("input",upd));
    $("#n-pick-list").addEventListener("change",upd);
    upd();
    $("#n-create").addEventListener("click",()=>{
      const name=$("#n-name").value.trim(); if(!name){ toast("제품명을 입력해 주세요."); $("#n-name").focus(); return; }
      const sel=picked(); if(!sel.length){ toast("공정을 하나 이상 선택해 주세요."); return; }
      const id=uid("p"), owner=$("#n-owner").value.trim(), order=Math.max(0,...list.map(p=>p.order||0))+10;
      const {L, shift}=plan(); const snap=$("#n-snap")?.checked;
      let tasks;
      if (mode()==="copy" && src()) {
        tasks = sel.map(i=>{ const t=src().tasks[i]; return {id:uid("t"),main:t.main,sub:t.sub,proc:t.proc,bars:(t.bars||[]).map(b=>shiftBar(b,shift,snap&&!isLaunchTask(t),false))}; });
      } else {
        tasks = sel.map(i=>({id:uid("t"),main:TEMPLATE[i].main,sub:TEMPLATE[i].sub,proc:TEMPLATE[i].proc,bars:[]}));
      }
      const np={id,name,owner,order,tasks,createdAt:new Date().toISOString()};
      if (L!==null && !allBars(np).some(({t})=>isLaunchTask(t))) launchTaskOf(np,true).bars.push({id:uid("b"),start:ds(L),end:ds(L),label:"런칭",done:false});
      commit(id,()=>{ S.products[id]=np; },"‘"+name+"’ 일정표를 만들었습니다.");
      closeDrawer(); location.hash="p-"+id;
    });
  });
}

/* ---------- change launch date (re-plan backward) ---------- */
function openLaunch(p){
  const L0 = launchOf(p);
  drawer('<h3>런칭일 변경</h3><div class="ctx">'+(L0!==null?"현재 런칭 "+mdw(L0)+" · D-"+(L0-TODAY):"아직 런칭일이 없습니다")+'</div>'+
    '<div class="field"><label for="l-date">새 런칭 예정일</label><input type="date" id="l-date" value="'+ds(L0!==null?L0:prevWork(TODAY+120))+'"></div>'+
    (L0!==null?'<div class="field"><label>나머지 일정</label><div class="radio-list">'+
      '<label><input type="radio" name="l-mode" value="all" checked><span>런칭일에 맞춰 함께 이동 (역산 유지)<small>런칭까지 남은 간격을 그대로 두고 모든 일정을 같은 만큼 옮깁니다.</small></span></label>'+
      '<label><input type="radio" name="l-mode" value="only"><span>런칭 일정만 이동<small>다른 일정은 그대로 둡니다.</small></span></label></div></div>'+
      '<label class="check"><input type="checkbox" id="l-skip" checked> 완료 표시된 일정은 그대로 둠</label>'+
      '<label class="check"><input type="checkbox" id="l-snap" checked> 주말·휴무일에 시작하게 되는 일정은 직전 근무일로 당김</label>':'')+
    '<div class="note" id="l-prev"></div>'+
    '<div class="dactions"><button class="btn primary" id="l-go" type="button">적용</button><div class="spacer"></div><button class="btn ghost" data-close type="button">취소</button></div>',
  d=>{
    const $=q=>d.querySelector(q);
    const mode=()=>d.querySelector('input[name="l-mode"]:checked')?.value||"only";
    const targets=(shift)=>allBars(p).filter(({t,b})=>!isLaunchTask(t) && !($("#l-skip")?.checked && b.done));
    const upd=()=>{
      const pr=$("#l-prev"); pr.classList.remove("warn");
      if(!$("#l-date").value){ pr.textContent="날짜를 입력해 주세요."; return; }
      const L=dn($("#l-date").value), shift=L0===null?0:L-L0;
      if (L0===null || mode()==="only") { pr.textContent="런칭 일정을 "+mdw(L)+"(D-"+(L-TODAY)+")로 "+(L0===null?"표시합니다.":"옮깁니다."); return; }
      const tg=targets(); const snap=$("#l-snap").checked; let first=null;
      tg.forEach(({b})=>{ const v=dn(shiftBar(b,shift,snap).start); if(first===null||v<first) first=v; });
      let txt = (shift===0?"변경 없음.":(Math.abs(shift)+"일 "+(shift>0?"늦춥니다":"당깁니다")+". 일정 "+tg.length+"건이 함께 이동합니다."));
      if (first!==null && shift) txt += " 이동 후 가장 빠른 일정은 "+mdw(first)+"입니다.";
      if (first!==null && first<TODAY && shift<0) { pr.classList.add("warn"); txt += " 오늘보다 앞선 날짜로 밀려나는 일정이 있습니다. 해당 일정은 기간을 줄이거나 다시 배치해야 합니다."; }
      pr.textContent=txt;
    };
    d.querySelectorAll("input").forEach(el=>el.addEventListener("input",upd)); upd();
    $("#l-go").addEventListener("click",()=>{
      if(!$("#l-date").value){ toast("날짜를 입력해 주세요."); return; }
      const L=dn($("#l-date").value), shift=L0===null?0:L-L0, all=mode()==="all", snap=$("#l-snap")?.checked;
      commit(p.id,()=>{
        const lt=launchTaskOf(p,true);
        if (L0===null || !lt.bars.length) { lt.bars.push({id:uid("b"),start:ds(L),end:ds(L),label:"런칭",done:false}); }
        else p.tasks.filter(isLaunchTask).forEach(t=>t.bars.forEach(b=>{ b.start=ds(dn(b.start)+shift); b.end=ds(dn(b.end)+shift); }));
        if (all && shift) targets().forEach(({b})=>{ const nb=shiftBar(b,shift,snap,true); b.start=nb.start; b.end=nb.end; });
      }, "런칭일을 "+mdw(L)+"로 "+(L0===null?"정했습니다.":"바꿨습니다."+(all&&shift?" 일정도 함께 옮겼습니다.":"")));
      closeDrawer();
    });
  });
}

function openBulk(p){
  const mains=[...new Set(p.tasks.map(t=>t.main))];
  drawer('<h3>일괄 이동</h3><div class="ctx">기준일 이후에 시작하는 일정을 한 번에 앞당기거나 미룹니다.</div>'+
    '<div class="row2"><div class="field"><label for="k-from">기준일 (이 날 포함)</label><input type="date" id="k-from" value="'+ds(TODAY)+'"></div>'+
    '<div class="field"><label for="k-days">이동 일수</label><input type="number" id="k-days" value="7" step="1"></div></div>'+
    '<div class="field"><label for="k-scope">범위</label><select id="k-scope"><option value="">전체 공정</option>'+mains.map(m=>'<option>'+esc(m)+'</option>').join("")+'</select></div>'+
    '<label class="check"><input type="checkbox" id="k-skipdone" checked> 완료 표시된 일정은 그대로 둠</label>'+
    '<div class="note" id="k-prev"></div>'+
    '<div class="dactions"><button class="btn primary" id="k-go" type="button">이동</button><div class="spacer"></div><button class="btn ghost" data-close type="button">취소</button></div>',
  d=>{
    const pick=()=>{ const f=dn(d.querySelector("#k-from").value||ds(TODAY)), sc=d.querySelector("#k-scope").value, sk=d.querySelector("#k-skipdone").checked;
      return allBars(p).filter(({t,b})=>dn(b.start)>=f && (!sc||t.main===sc) && !(sk&&b.done)); };
    const prev=()=>{ const n=+d.querySelector("#k-days").value||0; const c=pick().length; d.querySelector("#k-prev").textContent = c+"개 일정을 "+Math.abs(n)+"일 "+(n>=0?"뒤로 미룹니다.":"앞으로 당깁니다."); };
    d.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",prev)); prev();
    d.querySelector("#k-go").addEventListener("click",()=>{ const n=Math.round(+d.querySelector("#k-days").value||0); const sel=pick(); if(!n||!sel.length){ toast("옮길 일정이 없습니다."); return; }
      commit(p.id,()=>{ sel.forEach(({b})=>{ b.start=ds(dn(b.start)+n); b.end=ds(dn(b.end)+n); }); }, sel.length+"개 일정을 "+Math.abs(n)+"일 "+(n>0?"미뤘습니다.":"당겼습니다.")); closeDrawer(); });
  });
}

function openDeleteProduct(p){
  drawer('<h3>제품 삭제</h3><p>‘'+esc(p.name)+'’ 일정표와 공정 '+p.tasks.length+'개, 일정 '+allBars(p).length+'건을 보드에서 지웁니다. 삭제한 뒤에도 첫 화면의 ‘변경 기록’에서 되살릴 수 있습니다.</p>'+
    '<div class="dactions"><button class="btn primary" style="background:var(--today);border-color:var(--today)" id="x-go" type="button">삭제</button><div class="spacer"></div><button class="btn ghost" data-close type="button">취소</button></div>',
  d=>d.querySelector("#x-go").addEventListener("click",()=>{ closeDrawer(); location.hash="home"; commit(p.id,()=>{ delete S.products[p.id]; },"‘"+p.name+"’을(를) 삭제했습니다."); }));
}


function openHelp(){
  drawer('<h3>일정표 사용법</h3>'+
    '<div class="help"><h4>일정 옮기기 · 기간 바꾸기</h4><ul>'+
    '<li>막대를 끌면 날짜가 옮겨집니다. 놓는 순간 저장됩니다.</li>'+
    '<li>막대의 왼쪽·오른쪽 끝을 끌면 시작일·종료일이 바뀝니다. 짧은 막대는 <b>주</b>나 <b>일</b> 보기로 확대한 뒤 조절하세요.</li>'+
    '<li><b>Shift</b>를 누른 채 끌면 그 뒤에 시작하는 일정이 모두 같은 만큼 함께 이동합니다.</li>'+
    '<li>막대를 누르면 내용·날짜·완료 여부를 직접 입력할 수 있습니다.</li>'+
    '<li>막대를 선택한 뒤 ←/→ 로 하루씩, Shift+←/→ 로 기간을 조절하고 Delete로 지웁니다.</li></ul>'+
    '<h4>일정 추가</h4><ul><li>공정 줄의 빈 칸을 끌거나 더블클릭하면 새 막대가 생깁니다.</li>'+
    '<li>‘일괄 이동’은 기준일 이후 일정을 한 번에 며칠 앞당기거나 미룹니다.</li></ul>'+
    '<h4>런칭일 기준 역산</h4><ul><li>신제품을 만들 때 런칭 예정일과 기준 제품을 고르면, 기준 제품의 공정 기간을 그대로 두고 런칭일에서 거꾸로 계산해 일정을 만듭니다.</li>'+
    '<li>상단의 런칭 ✎ 버튼으로 런칭일을 바꾸면 나머지 일정도 같은 간격으로 함께 이동합니다. 완료된 일정은 그대로 둡니다.</li>'+
    '<li>막대를 끌거나 누르면 런칭까지 남은 일수(D-)가 함께 표시됩니다.</li></ul>'+
    '<h4>공정 · 제품 관리</h4><ul><li>공정 줄에 마우스를 올리면 ＋(아래에 공정 추가), −(공정 삭제) 버튼이 나타납니다. 대분류 줄의 ＋는 그 대분류 끝에 공정을 추가합니다.</li>'+
    '<li>왼쪽 공정 이름을 누르면 이름·분류 변경, 순서 이동, 삭제를 할 수 있습니다. 공정 칸에서 표준 공정을 고르면 분류가 자동으로 채워집니다.</li>'+
    '<li>신제품을 만들 때 ‘공정 구성’을 펼쳐 제품 유형·포장형태에 맞지 않는 공정을 빼고 시작할 수 있습니다.</li>'+
    '<li>대분류 줄을 누르면 접히고 펼쳐집니다. ‘빈 공정 숨기기’로 일정이 있는 공정만 볼 수 있습니다.</li>'+
    '<li>실수했다면 ‘되돌리기’(Ctrl+Z)를 누르세요.</li>'+
    '<li>‘변경 기록’에서 누가 언제 무엇을 바꿨는지 보고, 원하는 시점의 일정표로 복구할 수 있습니다. 삭제된 제품은 첫 화면의 ‘변경 기록’에서 되살립니다.</li></ul>'+
    '<h4>화면 표시</h4><ul><li>막대 색은 대분류, 진한 막대는 완료, 빨간 세로선은 오늘입니다.</li><li>파란 음영은 주말, 붉은 음영은 휴무일(NPDP 시트의 휴무 목록)입니다.</li></ul></div>'+
    '<div class="dactions"><div class="spacer"></div><button class="btn ghost" data-close type="button">닫기</button></div>');
}
async function exportCsv(p){
  const q = v => '"'+String(v??"").replace(/"/g,'""')+'"';
  const lines=[["제품","담당","대분류","중분류","공정","시작","종료","기간(일)","내용","완료"].map(q).join(",")];
  p.tasks.forEach(t=>{ if(!(t.bars||[]).length) lines.push([p.name,p.owner,t.main,t.sub,t.proc,"","","","",""].map(q).join(","));
    (t.bars||[]).forEach(b=>lines.push([p.name,p.owner,t.main,t.sub,t.proc,b.start,b.end,span(b),b.label,b.done?"Y":""].map(q).join(","))); });
  const data = "﻿"+lines.join("\r\n");
  if (!S.dl) { toast("이 화면에서는 파일 저장을 지원하지 않습니다."); return; }
  try { await S.dl.save({filename:p.name.replace(/[\\/:*?"<>|]/g,"_")+"_일정.csv", data}); }
  catch(e){ if(e&&e.code!=="declined") toast("CSV를 저장하지 못했습니다."); }
}

/* ---------- main render ---------- */
function render(){
  if (S.drag) { S.pendingRender = true; return; }
  S.pendingRender = false;
  if (!S.loaded) return;
  const r = route();
  renderTop(r);
  if (r.view==="product") renderProduct(r.pid); else renderHome();
}
window.addEventListener("hashchange", ()=>{ closeDrawer(); render(); document.getElementById("main").scrollTop=0; });
let rz; window.addEventListener("resize", ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(S.zoom==="fit") render(); },150); });

/* ---------- boot ---------- */
(async function boot(){
  const main = document.getElementById("main");
  const fail = msg => { main.innerHTML = '<div class="empty"><h3>일정 보드를 열 수 없습니다</h3><p>'+msg+'</p></div>'; };
  const db = await window.claude?.use?.("db");
  if (!db) { fail("일정 저장소에 연결하지 못했습니다. 페이지를 새로 고쳐 주세요."); return; }
  const timer = setTimeout(()=>{ if(!S.loaded) fail("저장소 응답이 없습니다. 네트워크를 확인하고 페이지를 새로 고쳐 주세요."); }, 15000);
  S.db = db;
  window.claude.use("downloads").then(x=>{ S.dl=x; }).catch(()=>{});
  window.claude.use("assets").then(x=>{ S.assets=x; }).catch(()=>{});
  window.claude.use("user").then(async u=>{ if(!u) return; S.user=u; S.isAdmin=!!u.isAdmin; try{ S.me = await u.id(); }catch(e){} const c = await u.can("data.write"); if (c===false) { S.canWrite=false; } render(); }).catch(()=>{});
  S.imgs = {};
  db.collection("images").onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.src) m[d.id]=v.src; }); S.imgs=m; if(S.loaded) render(); }, ()=>{});
  db.collection("products").onSnapshot(snap=>{
    clearTimeout(timer);
    const seen = new Set();
    snap.docs.forEach(doc=>{ seen.add(doc.id); if (inflight[doc.id]||dirty[doc.id]) return;
      const inc = doc.data(), cur = S.products[doc.id];
      if (cur && stable(clean(cur))===stable(inc)) return;
      S.products[doc.id] = {...JSON.parse(JSON.stringify(inc)), id:doc.id}; });
    Object.keys(S.products).forEach(id=>{ if(!seen.has(id) && !inflight[id] && !dirty[id]) delete S.products[id]; });
    S.loaded = true;
    render();
  }, err=>{ clearTimeout(timer); fail("일정을 불러오지 못했습니다 ("+esc(err.code)+"). 잠시 후 새로 고쳐 주세요."); });
})();
</script>
